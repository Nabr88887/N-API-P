name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify in the documented root Docker toolchain
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            -w /workspace/backend \
            -e GOMODCACHE=/workspace/tmp/gomodcache \
            -e GOCACHE=/workspace/tmp/gocache \
            -e "GOSUMDB=sum.golang.org https://sum.golang.google.cn" \
            golang:1.25.12 \
            sh -c "go test ./... && go vet ./... && go build -buildvcs=false -o /workspace/tmp/n-api-p ./cmd/n-api-p && go mod verify"

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm run verify
